name: CWP Scripts CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    name: Bash Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Find all bash scripts
        id: scripts
        run: |
          scripts=$(find . -maxdepth 1 -type f -name '*.sh' -o -maxdepth 1 -type f -name '*_*' | grep -vE '(docs/|\.git)' | sort)
          echo "scripts<<EOF" >> $GITHUB_OUTPUT
          echo "$scripts" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Run bash -n syntax check
        run: |
          for script in ${{ steps.scripts.outputs.scripts }}; do
            if [ -f "$script" ] && [ -x "$script" ]; then
              echo "Checking $script..."
              bash -n "$script" || { echo "❌ Syntax error in $script"; exit 1; }
              echo "✅ $script"
            fi
          done

      - name: Run shellcheck
        run: |
          for script in ${{ steps.scripts.outputs.scripts }}; do
            if [ -f "$script" ] && [ -x "$script" ]; then
              echo "Linting $script..."
              shellcheck -x "$script" || { echo "⚠️ shellcheck warnings in $script"; }
            fi
          done

  validate-structure:
    name: Repository Structure Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Verify required files
        run: |
          # Check for required files
          required_files=("install.sh" "README.md" "LICENSE")
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            else
              echo "✅ Found $file"
            fi
          done

      - name: Check install.sh is executable
        run: |
          if [ ! -x install.sh ]; then
            echo "❌ install.sh is not executable"
            exit 1
          fi
          echo "✅ install.sh is executable"

      - name: Verify no node_modules
        run: |
          if [ -d "node_modules" ]; then
            echo "❌ node_modules should not be committed"
            exit 1
          fi
          echo "✅ No node_modules"

      - name: Verify .gitignore excludes docs/
        run: |
          if ! grep -q "^docs/" .gitignore; then
            echo "⚠️ .gitignore should exclude docs/"
          else
            echo "✅ .gitignore excludes docs/"
          fi

      - name: Count scripts
        run: |
          script_count=$(find . -maxdepth 1 -type f -name '*.sh' -o -maxdepth 1 -type f -name '*_*' | grep -vE '(docs/|\.git)' | wc -l)
          echo "Script count: $script_count"
          if [ "$script_count" -lt 90 ]; then
            echo "⚠️ Expected at least 90 scripts, found $script_count"
          else
            echo "✅ Script count looks correct"
          fi

  install-test:
    name: Install Test (Dry Run)
    runs-on: ubuntu-latest
    needs: [syntax-check, validate-structure]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run install.sh in dry-run mode
        run: |
          # We can't actually install on the runner (no CWP), but we can verify the installer logic
          # by checking it doesn't have obvious bugs
          bash -n install.sh
          echo "✅ install.sh syntax OK"

          # Check key installer components
          grep -q "TARGET_DIR=" install.sh && echo "✅ Has TARGET_DIR"
          grep -q "BACKUP_DIR=" install.sh && echo "✅ Has BACKUP_DIR"
          grep -q "bash -n" install.sh && echo "✅ Runs syntax check on scripts"
          grep -q "chmod +x" install.sh && echo "✅ Sets executable permissions"

          echo "✅ Install script structure validated"

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Check for insecure HTTP URLs
        run: |
          insecure_count=$(grep -r "http://" --include="*.sh" . | grep -vE "(localhost|127\.0\.0\.1|# )" | wc -l)
          if [ "$insecure_count" -gt 0 ]; then
            echo "❌ Found $insecure_count insecure HTTP URLs in scripts:"
            grep -r "http://" --include="*.sh" . | grep -vE "(localhost|127\.0\.0\.1|# )"
            exit 1
          fi
          echo "✅ No insecure HTTP download URLs found"

      - name: Check for shell injection vulnerabilities
        run: |
          # Basic check for eval with variables
          suspicious=$(grep -r "eval " --include="*.sh" . | grep -v "# " | wc -l)
          if [ "$suspicious" -gt 0 ]; then
            echo "⚠️ Found $suspicious uses of eval:"
            grep -rn "eval " --include="*.sh" . | grep -v "# "
          fi
          
